<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Stock, Ventes & Noms Produits</title>

    <!-- Inclusion de la bibliothèque de scan Html5-QRCode -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            margin: 0;
            padding: 16px;
            color: #333;
        }
        h1 {
            text-align: center;
            font-size: 1.3rem;
            margin-top: 0;
            color: #1e293b;
        }
        .card {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 16px;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            background: #fff;
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-success { background-color: #16a34a; color: white; }
        .btn-warning { background-color: #d97706; color: white; }
        .btn-info { background-color: #0284c7; color: white; }
        .btn-danger { background-color: #dc2626; color: white; }
        .btn-secondary { background-color: #64748b; color: white; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Statistiques */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .stat-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 1rem;
            font-weight: bold;
            color: #2563eb;
        }
        .stat-label {
            font-size: 0.7rem;
            color: #64748b;
        }

        /* Onglets */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
        }
        .tab-btn {
            background: #e2e8f0;
            color: #475569;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            flex: 1;
        }
        .tab-btn.active {
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.85rem;
        }
        th {
            background-color: #f8fafc;
            color: #475569;
        }
        .badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        .badge-vente { background: #fee2e2; color: #991b1b; }
        .badge-achat { background: #dcfce7; color: #166534; }
        .badge-credit { background: #fef3c7; color: #b45309; }
        .badge-acompte { background: #e0f2fe; color: #0369a1; }

        .btn-action-icon {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 2px 4px;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <h1>📦 Gestion Stock, Ventes & Produits</h1>

    <!-- Scanner -->
    <div class="card">
        <div id="reader"></div>
        <div style="margin-top: 10px;" class="btn-group">
            <button id="btn-start" class="btn-primary" onclick="startScanner()">📷 Activer la caméra</button>
            <button id="btn-stop" class="btn-secondary" onclick="stopScanner()" disabled>⏹️ Arrêter</button>
        </div>
    </div>

    <!-- Saisie -->
    <div class="card">
        <div class="form-group">
            <label for="client-name">Nom du Client :</label>
            <input type="text" id="client-name" placeholder="Ex: Client X / Comptoir" />
        </div>
        <div class="form-group">
            <label for="barcode">Code-barres scanné ou saisi :</label>
            <input type="text" id="barcode" placeholder="Scannez ou tapez le code..." onblur="verifierProduitExistant()" />
        </div>
        <div class="form-group">
            <label for="product-name">Nom du Produit :</label>
            <input type="text" id="product-name" placeholder="Ex: Filtre à air, Pneu..." />
        </div>
        <div class="form-group">
            <label for="quantity">Quantité :</label>
            <input type="number" id="quantity" value="1" min="1" />
        </div>
        <div class="form-group">
            <label for="price">Prix unitaire (€) :</label>
            <input type="number" id="price" value="0.00" step="0.01" min="0" placeholder="Prix" />
        </div>
        <div class="form-group">
            <label for="payment-status">Statut du paiement :</label>
            <select id="payment-status">
                <option value="paye">Payé (Comptant)</option>
                <option value="credit">À Crédit (Non payé)</option>
            </select>
        </div>
        
        <div class="btn-group" style="flex-direction: column; gap: 8px;">
            <div style="display: flex; gap: 8px; width: 100%;">
                <button class="btn-success" onclick="modifierStock('ajout')" style="flex:1;">➕ Entrée Stock (Achat)</button>
                <button class="btn-warning" onclick="modifierStock('vente')" style="flex:1;">➖ Vente (Sortie)</button>
            </div>
            <button class="btn-info" onclick="encaisserSansLivraison()">💵 Encaisser sans livrer (Acompte)</button>
        </div>
    </div>

    <!-- Tableau de bord -->
    <div class="card">
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Articles en stock</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="stat-ca" style="color: #16a34a;">0.00 €</div>
                <div class="stat-label">CA Encaissé</div>
            </div>
            <div class="stat-box" style="grid-column: span 2;">
                <div class="stat-value" id="stat-credit" style="color: #d97706;">0.00 €</div>
                <div class="stat-label">Total Crédits Clients</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('stock')">📋 Stock</button>
            <button class="tab-btn" onclick="switchTab('history')">📜 Mouvements</button>
            <button class="tab-btn" onclick="switchTab('credits')">⏳ Crédits</button>
        </div>

        <!-- Onglet Stock -->
        <div id="view-stock" class="tab-content active">
            <div class="form-group">
                <input type="text" id="search-input" placeholder="🔍 Filtrer le stock (code ou nom)..." oninput="renderTables()" />
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Produit / Code</th>
                        <th>Qté</th>
                        <th>Prix U.</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="stock-list"></tbody>
            </table>
        </div>

        <!-- Onglet Historique -->
        <div id="view-history" class="tab-content">
            <table>
                <thead>
                    <tr>
                        <th>Date/Client</th>
                        <th>Type/Produit</th>
                        <th>Qté/Total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="history-list"></tbody>
            </table>
        </div>

        <!-- Onglet Crédits -->
        <div id="view-credits" class="tab-content">
            <table>
                <thead>
                    <tr>
                        <th>Client</th>
                        <th>Détail</th>
                        <th>Reste Dû</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="credit-list"></tbody>
            </table>
        </div>

        <div style="margin-top: 15px; display: flex; gap: 8px;">
            <button class="btn-secondary" style="font-size: 0.85rem;" onclick="exporterCSV()">📥 Exporter CSV</button>
            <button class="btn-danger" style="font-size: 0.85rem;" onclick="effacerTout()">🗑️ Tout effacer</button>
        </div>
    </div>

    <script>
        let html5QrCode = null;
        let stock = JSON.parse(localStorage.getItem('pro_stock_v4')) || {};
        let historyLog = JSON.parse(localStorage.getItem('pro_history_v4')) || [];
        let creditsLog = JSON.parse(localStorage.getItem('pro_credits_v4')) || [];

        renderTables();

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 150 } };
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
                .then(() => {
                    document.getElementById('btn-start').disabled = true;
                    document.getElementById('btn-stop').disabled = false;
                }).catch(err => alert("Erreur caméra : " + err));
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('btn-start').disabled = false;
                    document.getElementById('btn-stop').disabled = true;
                });
            }
        }

        function onScanSuccess(decodedText) {
            document.getElementById('barcode').value = decodedText;
            verifierProduitExistant();
            if (navigator.vibrate) navigator.vibrate(100);
        }

        // Remplit automatiquement le nom du produit et le prix si le code existe déjà
        function verifierProduitExistant() {
            const barcode = document.getElementById('barcode').value.trim();
            if (stock[barcode]) {
                if (stock[barcode].name) {
                    document.getElementById('product-name').value = stock[barcode].name;
                }
                if (stock[barcode].lastPrice) {
                    document.getElementById('price').value = stock[barcode].lastPrice;
                }
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            if (tabName === 'stock') {
                document.getElementById('view-stock').classList.add('active');
                event.target.classList.add('active');
            } else if (tabName === 'history') {
                document.getElementById('view-history').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('view-credits').classList.add('active');
                event.target.classList.add('active');
            }
        }

        function modifierStock(type) {
            const client = document.getElementById('client-name').value.trim() || "Client Inconnu";
            const barcode = document.getElementById('barcode').value.trim();
            const productName = document.getElementById('product-name').value.trim() || "Produit sans nom";
            const quantity = parseInt(document.getElementById('quantity').value, 10);
            const price = parseFloat(document.getElementById('price').value);
            const paymentStatus = document.getElementById('payment-status').value;

            if (!barcode) { alert("Veuillez scanner ou saisir un code-barres."); return; }
            if (isNaN(quantity) || quantity <= 0) { alert("Quantité invalide."); return; }
            if (isNaN(price) || price < 0) { alert("Prix invalide."); return; }

            if (!stock[barcode]) { 
                stock[barcode] = { qty: 0, name: productName, lastPrice: price }; 
            } else {
                stock[barcode].name = productName; // Met à jour le nom si modifié
            }

            if (type === 'ajout') {
                stock[barcode].qty += quantity;
                stock[barcode].lastPrice = price;
            } else if (type === 'vente') {
                if (stock[barcode].qty < quantity) {
                    alert(`Stock insuffisant ! Il reste ${stock[barcode].qty} exemplaire(s).`);
                    return;
                }
                stock[barcode].qty -= quantity;
                stock[barcode].lastPrice = price;
            }

            const totalAmount = quantity * price;
            const now = new Date().toLocaleString();
            let typeLabel = type === 'ajout' ? 'ACHAT' : (paymentStatus === 'credit' ? 'VENTE CRÉDIT' : 'VENTE');

            historyLog.unshift({
                id: Date.now(),
                date: now,
                client: client,
                type: typeLabel,
                barcode: barcode,
                productName: productName,
                qty: quantity,
                price: price,
                total: totalAmount
            });

            if (type === 'vente' && paymentStatus === 'credit') {
                creditsLog.unshift({
                    id: Date.now(),
                    client: client,
                    detail: `${quantity}x ${productName} (${barcode})`,
                    amount: totalAmount
                });
            }

            sauvegarderEtActualiser();
        }

        function encaisserSansLivraison() {
            const client = document.getElementById('client-name').value.trim() || "Client Inconnu";
            const price = parseFloat(document.getElementById('price').value);

            if (isNaN(price) || price <= 0) { alert("Montant d'acompte invalide."); return; }

            const now = new Date().toLocaleString();
            historyLog.unshift({
                id: Date.now(),
                date: now,
                client: client,
                type: 'ACOMPTE',
                barcode: 'N/A',
                productName: 'Acompte / Avance',
                qty: 0,
                price: price,
                total: price
            });

            sauvegarderEtActualiser();
        }

        // Éditer un produit du stock
        function editerStock(barcode) {
            const item = stock[barcode];
            const nouveauNom = prompt(`Modifier le NOM du produit (${barcode}) :`, item.name || "");
            if (nouveauNom === null) return;

            const nouvelleQtyStr = prompt(`Modifier la QUANTITÉ :`, item.qty);
            if (nouvelleQtyStr === null) return;
            const nouvelleQty = parseInt(nouvelleQtyStr, 10);

            const nouveauPrixStr = prompt(`Modifier le PRIX UNITAIRE (€) :`, item.lastPrice);
            if (nouveauPrixStr === null) return;
            const nouveauPrix = parseFloat(nouveauPrixStr);

            if (!isNaN(nouvelleQty) && nouvelleQty >= 0 && !isNaN(nouveauPrix) && nouveauPrix >= 0) {
                stock[barcode].name = nouveauNom.trim() || "Produit sans nom";
                stock[barcode].qty = nouvelleQty;
                stock[barcode].lastPrice = nouveauPrix;
                sauvegarderEtActualiser();
            } else {
                alert("Valeurs saisies invalides.");
            }
        }

        function editerHistorique(id) {
            const index = historyLog.findIndex(h => h.id === id);
            if (index === -1) return;
            const h = historyLog[index];

            const nouveauClient = prompt("Nom du Client :", h.client);
            if (nouveauClient === null) return;

            const nouveauNomProduit = prompt("Nom du Produit :", h.productName || "");
            if (nouveauNomProduit === null) return;

            const nouvelleQtyStr = prompt("Quantité :", h.qty);
            if (nouvelleQtyStr === null) return;
            const nouvelleQty = parseInt(nouvelleQtyStr, 10);

            const nouveauPrixStr = prompt("Prix unitaire (€) :", h.price || 0);
            if (nouveauPrixStr === null) return;
            const nouveauPrix = parseFloat(nouveauPrixStr);

            if (!isNaN(nouvelleQty) && !isNaN(nouveauPrix)) {
                historyLog[index].client = nouveauClient.trim() || "Client Inconnu";
                historyLog[index].productName = nouveauNomProduit.trim() || "Produit sans nom";
                historyLog[index].qty = nouvelleQty;
                historyLog[index].price = nouveauPrix;
                historyLog[index].total = nouvelleQty * nouveauPrix;
                sauvegarderEtActualiser();
            }
        }

        function reglerCredit(id) {
            const index = creditsLog.findIndex(c => c.id === id);
            if (index === -1) return;
            const credit = creditsLog[index];

            const paiementStr = prompt(`Montant réglé par ${credit.client} (Total dû : ${credit.amount.toFixed(2)} €) :`, credit.amount);
            if (paiementStr === null) return;
            const paiement = parseFloat(paiementStr);

            if (isNaN(paiement) || paiement <= 0) { alert("Montant invalide."); return; }

            if (paiement >= credit.amount) {
                creditsLog.splice(index, 1);
            } else {
                creditsLog[index].amount -= paiement;
            }

            historyLog.unshift({
                id: Date.now(),
                date: new Date().toLocaleString(),
                client: credit.client,
                type: 'ACOMPTE',
                barcode: 'Règlement Crédit',
                productName: 'Règlement partiel/total',
                qty: 0,
                price: paiement,
                total: paiement
            });

            sauvegarderEtActualiser();
        }

        function supprimerStock(barcode) {
            if (confirm(`Supprimer complètement ${barcode} du stock ?`)) {
                delete stock[barcode];
                sauvegarderEtActualiser();
            }
        }

        function supprimerHistorique(id) {
            if (confirm("Supprimer cette ligne d'historique ?")) {
                historyLog = historyLog.filter(h => h.id !== id);
                sauvegarderEtActualiser();
            }
        }

        function effacerTout() {
            if (confirm("Voulez-vous vraiment TOUT réinitialiser ?")) {
                stock = {}; historyLog = []; creditsLog = [];
                localStorage.removeItem('pro_stock_v4');
                localStorage.removeItem('pro_history_v4');
                localStorage.removeItem('pro_credits_v4');
                renderTables();
            }
        }

        function sauvegarderEtActualiser() {
            localStorage.setItem('pro_stock_v4', JSON.stringify(stock));
            localStorage.setItem('pro_history_v4', JSON.stringify(historyLog));
            localStorage.setItem('pro_credits_v4', JSON.stringify(creditsLog));

            document.getElementById('barcode').value = '';
            document.getElementById('product-name').value = '';
            document.getElementById('client-name').value = '';
            document.getElementById('quantity').value = 1;
            document.getElementById('price').value = '0.00';
            renderTables();
        }

        function renderTables() {
            // Stock
            const tbodyStock = document.getElementById('stock-list');
            const searchFilter = document.getElementById('search-input').value.toLowerCase().trim();
            tbodyStock.innerHTML = '';
            let keys = Object.keys(stock), totalUnits = 0;
            keys.forEach(k => totalUnits += stock[k].qty);
            document.getElementById('stat-total').innerText = totalUnits;

            const filteredKeys = keys.filter(barcode => {
                let item = stock[barcode];
                let nameMatch = item.name && item.name.toLowerCase().includes(searchFilter);
                let codeMatch = barcode.toLowerCase().includes(searchFilter);
                return nameMatch || codeMatch;
            });

            if (filteredKeys.length === 0) {
                tbodyStock.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8;">Aucun produit</td></tr>';
            } else {
                filteredKeys.forEach(barcode => {
                    let item = stock[barcode];
                    tbodyStock.innerHTML += `<tr>
                        <td><b>${item.name || 'Sans nom'}</b><br><code style="font-size:0.75rem; color:#64748b;">${barcode}</code></td>
                        <td><span class="badge">${item.qty}</span></td>
                        <td>${item.lastPrice.toFixed(2)} €</td>
                        <td>
                            <button class="btn-action-icon" onclick="editerStock('${barcode}')" title="Modifier">✏️</button>
                            <button class="btn-action-icon" onclick="supprimerStock('${barcode}')" title="Supprimer">❌</button>
                        </td>
                    </tr>`;
                });
            }

            // Calculs financiers
            let totalCA = 0, totalCredit = 0;
            historyLog.forEach(h => {
                if (h.type === 'VENTE' || h.type === 'ACOMPTE') totalCA += h.total;
            });
            creditsLog.forEach(c => totalCredit += c.amount);

            document.getElementById('stat-ca').innerText = totalCA.toFixed(2) + " €";
            document.getElementById('stat-credit').innerText = totalCredit.toFixed(2) + " €";

            // Historique
            const tbodyHistory = document.getElementById('history-list');
            tbodyHistory.innerHTML = '';
            if (historyLog.length === 0) {
                tbodyHistory.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8;">Aucun mouvement</td></tr>';
            } else {
                historyLog.forEach(h => {
                    let bClass = h.type === 'ACHAT' ? 'badge-achat' : (h.type === 'VENTE CRÉDIT' ? 'badge-credit' : (h.type === 'ACOMPTE' ? 'badge-acompte' : 'badge-vente'));
                    tbodyHistory.innerHTML += `<tr>
                        <td><span style="font-size:0.7rem; color:#64748b;">${h.date}</span><br><b>${h.client}</b></td>
                        <td><span class="badge ${bClass}">${h.type}</span><br><b>${h.productName || 'N/A'}</b> <code style="font-size:0.7rem;">(${h.barcode})</code></td>
                        <td>${h.qty} x ${h.price ? h.price.toFixed(2) : 0}€<br><b>${h.total.toFixed(2)} €</b></td>
                        <td>
                            <button class="btn-action-icon" onclick="editerHistorique(${h.id})" title="Modifier">✏️</button>
                            <button class="btn-action-icon" onclick="supprimerHistorique(${h.id})" title="Supprimer">❌</button>
                        </td>
                    </tr>`;
                });
            }

            // Crédits
            const tbodyCredit = document.getElementById('credit-list');
            tbodyCredit.innerHTML = '';
            if (creditsLog.length === 0) {
                tbodyCredit.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8;">Aucun crédit en cours 🎉</td></tr>';
            } else {
                creditsLog.forEach(c => {
                    tbodyCredit.innerHTML += `<tr>
                        <td><b>${c.client}</b></td>
                        <td>${c.detail}</td>
                        <td style="color:#d97706; font-weight:bold;">${c.amount.toFixed(2)} €</td>
                        <td><button class="btn-success" style="padding:4px 8px; font-size:0.75rem;" onclick="reglerCredit(${c.id})">💵 Régler</button></td>
                    </tr>`;
                });
            }
        }

        function exporterCSV() {
            if (historyLog.length === 0) { alert("Rien à exporter."); return; }
            let csv = "ID;Date;Client;Type;Nom_Produit;Code_Barres;Quantite;Prix_Unitaire;Total_Euros\n";
            historyLog.forEach(h => csv += `${h.id};${h.date};${h.client};${h.type};"${h.productName || ''}";${h.barcode};${h.qty};${h.price};${h.total}\n`);
            let link = document.createElement("a");
            link.setAttribute("href", encodeURI("data:text/csv;charset=utf-8," + csv));
            link.setAttribute("download", `export_stock_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
    </script>
</body>
</html>
