<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d6336c">
<title>Scanner de prix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: boutique, net, rapide — une étiquette de prix lisible à un mètre
   IDEA: l'étiquette de rayon / ticket de caisse
   PICTURE: la fiche produit scannée, photo + gros prix
   COLOUR and TYPE: blanc, encre, rose gloss #d6336c en accent ; Archivo
   LAYOUT: barre de recherche en haut, caméra, fiche produit, liste */
:root{color-scheme:light dark;--bg:light-dark(#f6f4f2,#141214);--card:light-dark(#fff,#1f1c1f);--ink:light-dark(#18161a,#f3eff2);--mute:light-dark(#6d6870,#a39ca4);--line:light-dark(#e4dfe2,#332e33);--acc:#d6336c;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
header{background:var(--acc);color:#fff;padding:14px max(4vw,14px);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:22px;margin:0;font-weight:900;flex:1}
header small{opacity:.85}
main{max-width:760px;margin:0 auto;padding:14px max(4vw,14px) 60px;display:grid;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=search]{flex:1;font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:48px}
input:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 50%,transparent);outline-offset:1px}
button,.btn{font:inherit;font-weight:700;min-height:48px;padding:0 16px;border-radius:10px;border:2px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.ghost,.btn.ghost{background:transparent;color:var(--acc)}
header .btn{border-color:#fff;background:#fff;color:var(--acc)}
#reader{border-radius:12px;overflow:hidden;background:#000;display:none}
#reader.on{display:block}
.tag{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr)}
.tag .ph{background:#fff;display:grid;place-items:center;aspect-ratio:1}
.tag .ph img{max-width:100%;max-height:100%;object-fit:contain}
.tag .ph span{color:#aaa;font-size:13px}
.tag .info{padding:16px 18px;display:grid;gap:6px;align-content:start;border-left:3px dashed var(--line)}
.code{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.name{font-size:20px;font-weight:700;line-height:1.2;text-wrap:balance}
.price{font-size:clamp(38px,9vw,52px);font-weight:900;line-height:1.05;color:var(--acc);white-space:nowrap}
.price small{font-size:.45em;font-weight:700}
.old{text-decoration:line-through;color:var(--mute);font-size:18px;white-space:nowrap}
.stock{font-weight:700}.stock.z{color:var(--warn)}.stock.p{color:var(--ok)}
.cost{color:var(--mute);font-size:14px}
.det{color:var(--mute);font-size:14px}
.msg{padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.msg.err{border-color:var(--warn);color:var(--warn);font-weight:700}
.empty{text-align:center;padding:34px 16px;background:var(--card);border:2px dashed var(--line);border-radius:14px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
ul.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
ul.list li{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:48px}
ul.list li:first-child{border-top:0}
ul.list li:hover{background:color-mix(in srgb,var(--acc) 7%,transparent)}
ul.list .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.list .p{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.opts{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:14px}
.opts label{display:flex;gap:6px;align-items:center;min-height:32px}
.hide{display:none!important}
@media(max-width:560px){.tag{grid-template-columns:1fr}.tag .ph{aspect-ratio:auto;height:220px}.tag .info{border-left:0;border-top:3px dashed var(--line)}}
@media(prefers-reduced-motion:no-preference){.tag{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}}}
</style>
</head>
<body>
<header>
  <h1>Scanner de prix <small id="count"></small></h1>
  <label class="btn" for="file">Charger Excel</label>
  <input id="file" type="file" accept=".xlsx,.xls,.csv" class="hide">
</header>
<main>
  <div class="row">
    <input id="q" type="search" placeholder="Code barre ou nom du produit…" autocomplete="off" enterkeyhint="search">
    <button id="cam" type="button">Scanner</button>
  </div>
  <div class="row">
    <button id="photo" type="button" class="ghost">Scanner depuis une photo</button>
    <input id="photoIn" type="file" accept="image/*" capture="environment" class="hide">
  </div>
  <div id="reader"></div>
  <div id="out"><div class="empty"><b>Aucun catalogue chargé</b>Touchez « Charger Excel » et choisissez votre fichier Products.xlsx (colonnes barcode, name, price, promoPrice, stock, currency, imageUri…). Il reste enregistré sur ce téléphone.</div></div>
  <ul id="list" class="list hide"></ul>
  <div class="opts">
    <label><input type="checkbox" id="showCost"> Afficher le prix d'achat et la marge</label>
    <label><input type="checkbox" id="beep" checked> Bip au scan</label>
    <label><input type="checkbox" id="cont"> Scan continu</label>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
{
const $ = id => document.getElementById(id);
const KEY = 'scanner-prix-catalogue';
let items = [], byCode = new Map(), scanner = null, scanning = false, lastCode = '', lastAt = 0;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === null || v === undefined || v === '') return null; const n = Number(String(v).replace(/\s/g,'').replace(',','.')); return isNaN(n) ? null : n; };
const fmt = n => n === null ? '—' : n.toLocaleString('fr-FR', {maximumFractionDigits: 2});
const norm = c => String(c ?? '').trim().replace(/^0+(?=\d)/, '').toUpperCase();

function pick(row, names) {
  const keys = Object.keys(row);
  for (const n of names) {
    const k = keys.find(k => k.trim().toLowerCase() === n.toLowerCase());
    if (k !== undefined && row[k] !== '') return row[k];
  }
  return '';
}

function setCatalogue(list, save) {
  items = list; byCode = new Map();
  for (const p of items) if (p.barcode) byCode.set(norm(p.barcode), p);
  $('count').textContent = items.length ? '· ' + items.length + ' produits' : '';
  if (save) { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }
  if (items.length) $('out').innerHTML = '<div class="msg">Catalogue prêt : ' + items.length + ' produits. Scannez un article ou tapez son nom.</div>';
}

function parseSheet(buf) {
  const wb = XLSX.read(buf, {type: 'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {defval: '', raw: true});
  return rows.map(r => ({
    barcode: String(pick(r, ['barcode','code barre','code-barres','ean'])).trim(),
    name: String(pick(r, ['name','description','nom','désignation'])).trim(),
    price: num(pick(r, ['price','prix','prix (dzd ht)','prix public'])),
    promo: num(pick(r, ['promoPrice','prix promo'])),
    unit: String(pick(r, ['unit','unité'])).trim(),
    stock: num(pick(r, ['stock','quantité','qte'])),
    currency: String(pick(r, ['currency','devise']) || 'DZD').trim(),
    details: String(pick(r, ['details','détails'])).trim(),
    img: String(pick(r, ['imageUri','image','photo','image 1'])).trim(),
    cost: num(pick(r, ['Prix d’achat',"Prix d'achat",'prix achat','cost']))
  })).filter(p => p.barcode || p.name);
}

function card(p) {
  const cur = esc(p.currency || 'DZD');
  const hasPromo = p.promo !== null && p.promo > 0 && p.promo < (p.price ?? Infinity);
  const sell = hasPromo ? p.promo : p.price;
  const st = p.stock === null ? '' : '<div class="stock ' + (p.stock > 0 ? 'p' : 'z') + '">' + (p.stock > 0 ? 'En stock : ' + fmt(p.stock) + (p.unit ? ' ' + esc(p.unit) : '') : 'Rupture de stock') + '</div>';
  let cost = '';
  if ($('showCost').checked && p.cost !== null) {
    const m = sell ? Math.round((sell - p.cost) / sell * 100) : null;
    cost = '<div class="cost">Prix d\'achat : ' + fmt(p.cost) + ' ' + cur + (m !== null ? ' · marge ' + m + ' %' : '') + '</div>';
  }
  const ph = p.img ? '<img src="' + esc(p.img) + '" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{textContent:\'Photo indisponible\'}))">' : '<span>Pas de photo</span>';
  return '<article class="tag"><div class="ph">' + ph + '</div><div class="info">' +
    '<div class="code">' + esc(p.barcode) + '</div><div class="name">' + esc(p.name) + '</div>' +
    (hasPromo ? '<div class="old">' + fmt(p.price) + ' ' + cur + '</div>' : '') +
    '<div class="price">' + fmt(sell) + ' <small>' + cur + '</small></div>' + st + cost +
    (p.details ? '<div class="det">' + esc(p.details) + '</div>' : '') + '</div></article>';
}

function show(p) { $('out').innerHTML = card(p); $('list').classList.add('hide'); }

function beep(ok) {
  if (!$('beep').checked) return;
  try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.frequency.value = ok ? 1400 : 300; g.gain.value = .15; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + (ok ? .12 : .35)); } catch (e) {}
}

function lookup(code) {
  code = String(code).trim(); if (!code) return;
  $('q').value = code;
  const p = byCode.get(norm(code));
  if (p) { show(p); beep(true); }
  else { $('out').innerHTML = '<div class="msg err">Produit introuvable : ' + esc(code) + '</div>'; $('list').classList.add('hide'); beep(false); }
}

function search(text) {
  const t = text.trim().toLowerCase();
  if (!t) { $('list').classList.add('hide'); return; }
  const exact = byCode.get(norm(t)); if (exact) { show(exact); return; }
  const words = t.split(/\s+/);
  const res = items.filter(p => words.every(w => (p.name + ' ' + p.barcode).toLowerCase().includes(w))).slice(0, 40);
  const ul = $('list');
  ul.innerHTML = res.length ? res.map(p => '<li data-c="' + esc(p.barcode) + '" data-i="' + items.indexOf(p) + '"><span class="n">' + esc(p.name) + '</span><span class="p">' + fmt(p.promo || p.price) + ' ' + esc(p.currency) + '</span></li>').join('') : '<li>Aucun résultat</li>';
  ul.classList.remove('hide');
}

const FORMATS = () => window.Html5QrcodeSupportedFormats ? [ 'EAN_13','EAN_8','UPC_A','UPC_E','CODE_128','CODE_39','CODE_93','ITF','CODABAR','QR_CODE' ].map(f => Html5QrcodeSupportedFormats[f]) : undefined;

async function startCam() {
  if (scanning) return stopCam();
  if (!window.Html5Qrcode) { $('out').innerHTML = '<div class="msg err">Le module de scan n\'a pas pu se charger (connexion internet nécessaire au premier lancement).</div>'; return; }
  $('reader').classList.add('on');
  scanner = scanner || new Html5Qrcode('reader', {formatsToSupport: FORMATS(), useBarCodeDetectorIfSupported: true, verbose: false});
  try {
    await scanner.start({facingMode: 'environment'}, {fps: 12, qrbox: (w, h) => ({width: Math.floor(w * .85), height: Math.floor(Math.min(h * .5, 180))})}, code => {
      const now = Date.now();
      if (code === lastCode && now - lastAt < 2500) return;
      lastCode = code; lastAt = now; lookup(code);
      if (!$('cont').checked) stopCam();
    });
    scanning = true; $('cam').textContent = 'Arrêter';
  } catch (e) {
    $('reader').classList.remove('on');
    $('out').innerHTML = '<div class="msg err">Caméra inaccessible. Autorisez la caméra pour ce site (la page doit être ouverte en https), ou utilisez « Scanner depuis une photo ».</div>';
  }
}
async function stopCam() {
  if (scanner && scanning) { try { await scanner.stop(); } catch (e) {} }
  scanning = false; $('reader').classList.remove('on'); $('cam').textContent = 'Scanner';
}

$('cam').addEventListener('click', startCam);
$('photo').addEventListener('click', () => $('photoIn').click());
$('photoIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (!window.Html5Qrcode) return;
  await stopCam();
  const tmp = new Html5Qrcode('reader', {formatsToSupport: FORMATS(), useBarCodeDetectorIfSupported: true, verbose: false});
  try { lookup(await tmp.scanFile(f, false)); }
  catch (err) { $('out').innerHTML = '<div class="msg err">Aucun code barre lisible sur la photo. Réessayez plus près, bien à plat et éclairé.</div>'; beep(false); }
  try { tmp.clear(); } catch (e) {}
});

$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (!window.XLSX) { $('out').innerHTML = '<div class="msg err">Le lecteur Excel n\'a pas pu se charger (connexion internet nécessaire).</div>'; return; }
  try { const list = parseSheet(await f.arrayBuffer());
    if (!list.length) throw new Error('vide');
    setCatalogue(list, true);
  } catch (err) { $('out').innerHTML = '<div class="msg err">Fichier illisible. Vérifiez que la 1re ligne contient les en-têtes (barcode, name, price…).</div>'; }
});

$('q').addEventListener('input', e => search(e.target.value));
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const v = e.target.value; if (byCode.has(norm(v))) lookup(v); else search(v); } });
$('list').addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (li) { const p = items[+li.dataset.i]; $('q').value = p.barcode; show(p); } });
$('showCost').addEventListener('change', () => { const c = byCode.get(norm($('q').value)); if (c) show(c); try { localStorage.setItem(KEY + '-cost', $('showCost').checked ? '1' : ''); } catch (e) {} });

try { $('showCost').checked = !!localStorage.getItem(KEY + '-cost'); const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (saved.length) setCatalogue(saved, false); } catch (e) {}
$('q').focus();
}
</script>
</body>
</html>
